
name: Bank Frontend Pipeline

on:
  push:
    branches:
      - main
  # pull_request:
  #   branches:
  #     - cicd

jobs:
  Continues-Integration_build_and_push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        repository: walefolarin0-glitch/bank-frontend
        ref: main


    - name: Log in to awscli
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1


    - name: Build container image
      run: docker build -t bank-frontend:latest .

    - name: Log in to ECR with short-lived credentials
      run: |
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin ${{ vars.ECR_REPO }}
  
    - name: Tag Docker image
      run: docker tag bank-frontend:latest ${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}
    
    - name: Create ECR repository if not exists
      run: |
        aws ecr describe-repositories --repository-names bank-frontend --region us-east-1 || aws ecr create-repository --repository-name bank-frontend --region us-east-1

    - name: Push image to ECR
      run: docker push ${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}


    - name: Clean up Docker image locally
      run: |
        docker rmi bank-frontend:latest
        docker rmi ${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}

    - name: Clean up GitHub repo on runner
      run: rm -rf ./*


  
  Continues-Update_k8s_manifest:
    runs-on: ubuntu-latest
    needs: Continues-Integration_build_and_push
    steps:
      - name: Update Kubernetes manifest
        env:
          GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
          GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
        run: |
          # Test credentials first
          curl -s -o /dev/null -w "%{http_code}" \
            -u "${GIT_USERNAME}:${GIT_PASSWORD}" \
            https://api.github.com/repos/walefolarin0-glitch/kubernetes-manifest

          # Clone repo
          git clone https://${GIT_USERNAME}:${GIT_PASSWORD}@github.com/walefolarin0-glitch/kubernetes-manifest.git

          cd kubernetes-manifest
          git config user.email "walefolarin0@gmail.com"
          git config user.name "walefolarin0-glitch"

          sed -i "s+${{ vars.ECR_REPO }}/bank-frontend:.*+${{ vars.ECR_REPO }}/bank-frontend:${{ github.run_number }}+g" ./bank-project/frontend.yaml

          grep "bank-frontend" ./bank-project/frontend.yaml

          git add bank-project/frontend.yaml
          git commit -m "Update frontend image to version ${{ github.run_number }}" || true
          git push https://${GIT_USERNAME}:${GIT_PASSWORD}@github.com/walefolarin0-glitch/kubernetes-manifest.git main